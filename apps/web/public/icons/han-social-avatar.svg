<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ECFEFF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Icon gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Subtle gradient background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- Centered icon -->
  <g transform="translate(250, 280)">
    <rect x="0" y="120" width="80" height="120" rx="16" fill="url(#iconGrad)"/>
    <rect x="100" y="60" width="80" height="180" rx="16" fill="url(#iconGrad)"/>
    <rect x="200" y="0" width="80" height="240" rx="16" fill="url(#iconGrad)"/>
  </g>
</svg>
