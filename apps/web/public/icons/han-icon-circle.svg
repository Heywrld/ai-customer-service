<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circular background -->
  <circle cx="100" cy="100" r="100" fill="#FFFFFF"/>
  
  <!-- Centered bars -->
  <g transform="translate(62, 70)">
    <rect x="0" y="40" width="24" height="40" rx="6" fill="url(#circle)"/>
    <rect x="28" y="20" width="24" height="60" rx="6" fill="url(#circle)"/>
    <rect x="56" y="0" width="24" height="80" rx="6" fill="url(#circle)"/>
  </g>
</svg>
