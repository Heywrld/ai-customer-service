<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ECFEFF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Icon gradient -->
    <linearGradient id="iconSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="200" height="200" rx="40" fill="url(#bgSquare)"/>
  
  <!-- Centered bars -->
  <g transform="translate(62, 70)">
    <rect x="0" y="40" width="24" height="40" rx="6" fill="url(#iconSquare)"/>
    <rect x="28" y="20" width="24" height="60" rx="6" fill="url(#iconSquare)"/>
    <rect x="56" y="0" width="24" height="80" rx="6" fill="url(#iconSquare)"/>
  </g>
</svg>
