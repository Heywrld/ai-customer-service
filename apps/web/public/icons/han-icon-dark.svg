<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Dark background -->
  <rect width="200" height="200" fill="#0F172A" rx="40"/>
  
  <!-- Brighter bars for contrast -->
  <g transform="translate(62, 70)">
    <rect x="0" y="40" width="24" height="40" rx="6" fill="url(#dark)"/>
    <rect x="28" y="20" width="24" height="60" rx="6" fill="url(#dark)"/>
    <rect x="56" y="0" width="24" height="80" rx="6" fill="url(#dark)"/>
  </g>
</svg>
