<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="app" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Clean white background with subtle rounding -->
  <rect width="1024" height="1024" fill="#FFFFFF" rx="180"/>
  
  <!-- Centered bars with proper padding (20% margin) -->
  <g transform="translate(300, 360)">
    <!-- Bar 1 -->
    <rect x="0" y="160" width="120" height="160" rx="24" fill="url(#app)"/>
    
    <!-- Bar 2 -->
    <rect x="140" y="80" width="120" height="240" rx="24" fill="url(#app)"/>
    
    <!-- Bar 3 -->
    <rect x="280" y="0" width="120" height="320" rx="24" fill="url(#app)"/>
  </g>
</svg>
